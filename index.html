    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
                        'glow': '0 0 20px rgba(168, 85, 247, 0.35)',
                        'card-shine': 'inset 0 1px 0 0 rgba(255, 255, 255, 0.6)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f2942 100%);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .glass-card-item {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 250, 252, 0.85) 100%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
        }

        .glossy-header {
            background: linear-gradient(-45deg, #ec4899, #8b5cf6, #3b82f6, #10b981, #f59e0b, #ef4444);
            background-size: 400% 400%;
            animation: colorShift 12s ease infinite;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
            position: relative;
            overflow: hidden;
        }

        .item-text-gradient {
            background: linear-gradient(-45deg, #ec4899, #8b5cf6, #3b82f6, #10b981, #f59e0b);
            background-size: 300% 300%;
            animation: colorShift 8s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .glass-card-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            transform: skewX(-25deg);
            animation: itemShine 6s infinite;
            pointer-events: none;
        }

        @keyframes itemShine {
            0% { left: -100%; }
            30% { left: 200%; }
            100% { left: 200%; }
        }

        .btn-gradient-dynamic {
            background: linear-gradient(-45deg, #8b5cf6, #ec4899, #3b82f6, #10b981);
            background-size: 300% 300%;
            animation: colorShift 8s ease infinite;
        }

        @keyframes colorShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glossy-header::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            transform: skewX(-25deg);
            animation: shine 5s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .completed-item {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .emoji-animated {
            display: inline-block;
            animation: floatEmoji 3s ease-in-out infinite alternate;
        }

        @keyframes floatEmoji {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-3px) rotate(4deg) scale(1.08); }
            100% { transform: translateY(2px) rotate(-4deg) scale(1); }
        }

        .item-pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(-8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>

            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function lanzarConfeti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.8 },
                    colors: ['#a855f7', '#ec4899', '#3b82f6', '#10b981', '#f59e0b']
                });
            }
        }

        function analizarProducto(nombreIngresado) {
            const textoNormalizado = normalizarTexto(nombreIngresado);
            if (!textoNormalizado) return null;

            for (let categoria of REGLAS_CATEGORIAS) {
                for (let item of categoria.palabras) {
                    const kwNorm = normalizarTexto(item.kw);
                    const esFraseExacta = textoNormalizado === kwNorm;
                    const contienePalabraCompleta = textoNormalizado.split(/\s+/).includes(kwNorm);
                    const contieneFraseCompleta = kwNorm.includes(" ") && textoNormalizado.includes(kwNorm);

                    if (esFraseExacta || contienePalabraCompleta || contieneFraseCompleta) {
                        const nombreFormateado = nombreIngresado.charAt(0).toUpperCase() + nombreIngresado.slice(1);
                        return {
                            texto: nombreFormateado,
                            emoji: item.emoji,
                            categoria: categoria.nombre
                        };
                    }
                }
            }

            const nombreFormateado = nombreIngresado.charAt(0).toUpperCase() + nombreIngresado.slice(1);
            return {
                texto: nombreFormateado,
                emoji: "🛒",
                categoria: "Otros / Varios 🛍️"
            };
        }

        function agregarProductos(event) {
            event.preventDefault();
            const input = document.getElementById('productoInput');
            const valorTotal = input.value.trim();
            if (!valorTotal) return;

            // Split by commas, periods, " y ", " e ", or newlines
            let chunks = valorTotal
                .replace(/[\.\,\;\n]/g, ',')
                .replace(/\s+y\s+/gi, ',')
                .replace(/\s+e\s+/gi, ',')
                .split(',')
                .map(i => i.trim())
                .filter(i => i.length > 0);

            let nuevosAgregados = 0;

            chunks.forEach(trozo => {
                // First check if the whole chunk matches a single known item/category
                let resDirecto = analizarProducto(trozo);
                if (resDirecto && resDirecto.categoria !== "Otros / Varios 🛍️") {
                    lista.unshift({
                        id: Date.now() + Math.random(),
                        texto: resDirecto.texto,
                        emoji: resDirecto.emoji,
                        categoria: resDirecto.categoria,
                        completado: false,
                        nuevo: true
                    });
                    nuevosAgregados++;
                } else {
                    // Smart token scanner for space-separated list without punctuation (e.g., "soda agua leche")
                    const subTokens = trozo.split(/\s+/);
                    let i = 0;
                    while (i < subTokens.length) {
                        let matched = false;
                        // Try matching multi-word phrases (up to 3 words) down to single words
                        for (let len = Math.min(3, subTokens.length - i); len >= 1; len--) {
                            let intentoFrase = subTokens.slice(i, i + len).join(' ');
                            let resIntento = analizarProducto(intentoFrase);
                            if (resIntento && resIntento.categoria !== "Otros / Varios 🛍️") {
                                lista.unshift({
                                    id: Date.now() + Math.random(),
                                    texto: resIntento.texto,
                                    emoji: resIntento.emoji,
                                    categoria: resIntento.categoria,
                                    completado: false,
                                    nuevo: true
                                });
                                nuevosAgregados++;
                                i += len;
                                matched = true;
                                break;
                            }
                        }
                        
                        // If no multi-word phrase matched, process single token
                        if (!matched) {
                            let resUnico = analizarProducto(subTokens[i]);
                            if (resUnico) {
                                lista.unshift({
                                    id: Date.now() + Math.random(),
                                    texto: resUnico.texto,
                                    emoji: resUnico.emoji,
                                    categoria: resUnico.categoria,
                                    completado: false,
                                    nuevo: true
                                });
                                nuevosAgregados++;
                            }
                            i++;
                        }
                    }
                }
            });

            if (nuevosAgregados > 0) {
                lanzarConfeti();
            }

            input.value = '';
            renderizarLista();
        }

        function toggleCompletado(id) {
            lista = lista.map(item => item.id === id ? { ...item, completado: !item.completado } : item);
            renderizarLista();
        }

        function eliminarItem(id, event) {
            event.stopPropagation();
            lista = lista.filter(item => item.id !== id);
            renderizarLista();
        }

        function limpiarTodo() {
            if (lista.length === 0) return;
            document.getElementById('modalConfirm').classList.remove('hidden');
            document.getElementById('modalConfirm').classList.add('flex');
        }

        function cerrarModal() {
            document.getElementById('modalConfirm').classList.add('hidden');
            document.getElementById('modalConfirm').classList.remove('flex');
        }

        function confirmarLimpieza() {
            lista = [];
            cerrarModal();
            renderizarLista();
        }

        function renderizarLista() {
            const contenedor = document.getElementById('contenedorCategorias');
            const contador = document.getElementById('contadorItems');
            
            contador.textContent = `${lista.length} producto${lista.length === 1 ? '' : 's'}`;

            if (lista.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center py-10 px-4 text-slate-400">
                        <div class="w-16 h-16 bg-slate-200/50 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400">
                            <i class="fa-solid fa-basket-shopping text-2xl"></i>
                        </div>
                        <p class="text-sm font-semibold text-slate-600">Tu lista está vacía</p>
                        <p class="text-xs text-slate-400 mt-1">Escribe lo que necesitas para comenzar.</p>
                    </div>
                `;
                return;
            }

            const agrupados = {};
            lista.forEach(item => {
                if (!agrupados[item.categoria]) agrupados[item.categoria] = [];
                agrupados[item.categoria].push(item);
            });

            let html = '';
            for (let catNombre in agrupados) {
                const items = agrupados[catNombre];
                
                html += `
                    <div class="bg-white/60 rounded-2xl p-3 border border-slate-200/60 shadow-sm backdrop-blur-sm">
                        <h2 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5 px-1">
                            ${catNombre}
                        </h2>
                        <div class="space-y-1.5">
                `;

                items.forEach(item => {
                    const popClass = item.nuevo ? 'item-pop-in' : '';
                    delete item.nuevo;

                    html += `
                        <div onclick="toggleCompletado(${item.id})" 
                             class="glass-card-item ${popClass} flex items-center justify-between p-3 rounded-xl transition-all cursor-pointer hover:border-purple-400/80 active:scale-[0.99] ${
                                item.completado ? 'opacity-50' : ''
                             }">
                            <div class="flex items-center gap-3">
                                <div class="w-5 h-5 rounded-lg border transition-all flex items-center justify-center ${
                                    item.completado ? 'bg-purple-600 border-purple-600 text-white shadow-sm' : 'border-slate-300 bg-white'
                                }">
                                    ${item.completado ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                                </div>
                                <span class="text-sm font-bold flex items-center gap-2 ${item.completado ? 'completed-item text-slate-400' : ''}">
                                    <span class="${item.completado ? 'text-slate-400' : 'item-text-gradient'}">${item.texto}</span>
                                    <span class="emoji-animated text-base">${item.emoji}</span>
                                </span>
                            </div>
                            <button onclick="eliminarItem(${item.id}, event)" class="text-slate-300 hover:text-red-500 p-1.5 transition-colors relative z-10">
                                <i class="fa-solid fa-xmark text-sm"></i>
                            </button>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            contenedor.innerHTML = html;
        }

        renderizarLista();
    </script>
</body>
</html>
